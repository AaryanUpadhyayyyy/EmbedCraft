# llmifier Configuration File (`llmifierrc.yaml`)
# Generated by `llmifier --init`. Customize as needed.
# Full documentation: https://github.com/PhilippHGerber/llmifier

# --- Basic Settings ---

# Output file path. Default: "llms.txt"
# output: "llms.txt"

# Project type (influences default include/exclude and fileOrdering).
# Allowed: "dart". Default: "dart"
projectType: "dart"

# Extraction mode: "full" (all content) or "api" (public API for Dart).
# Default: "full"
mode: "full"

# Enable verbose logging. Default: false
# verbose: true

# --- Global File Inclusion/Exclusion (Glob Patterns) ---
# These apply BEFORE file ordering. Files excluded here will not be processed.

# Files/Directories to include:
include:
  - "**README.md"
  - "**CHANGELOG.md"
  - "**LICENSE"
  - "**CONTRIBUTING.md"
  - "**pubspec.yaml"
  - "**lib/**.dart"
  - "**bin/**.dart"
  - "**test/**.dart"
  - "**example/**.dart"
  - "**analysis_options.yaml"
  - "**build.yaml"

# Files/Directories to exclude (overrides includes):
exclude:
  - "*.g.dart"
  - "**/*.g.dart"
  - "*.freezed.dart"
  - "**/*.freezed.dart"
  - "**build"
  - "**.dart_tool"
  - "**.git"
  - "**.github"
  - "**.idea"
  - "**.vscode"
  - "**node_modules"
  - "**ios"
  - "**android"
  - "**web"
  - "**macos"
  - "**linux"
  - "**windows"
  - ".*"
  - "**/.*"
  - "llms*.txt"
  - "**/llms*.txt"

# Add project-specific global excludes below:
# - "**/specific_tool_generated_output/"

# --- File Ordering Strategy ---
# Defines how included files are grouped and ordered in the output.
# Files are assigned to the *first* matching group in this list.
fileOrdering:
  groups:
    - name: "Documentation"
      patterns:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "docs/**"
      order:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      sortBy: "alphabetical"

    - name: "Metadata"
      patterns:
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "build.yaml"
      order:
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "build.yaml"
      sortBy: "alphabetical"

    - name: "Executable"
      patterns:
      - "bin/**"
      sortBy: "depthFirst"

    - name: "Application Code"
      patterns:
      - "lib/**"
      sortBy: "depthFirst"

    - name: "Packages"
      patterns:
      - "packages/**"
      order:
      - "README.md"
      - "CHANGELOG.md"
      - "pubspec.yaml"
      sortBy: "depthFirst"

    - name: "Example"
      patterns:
      - "example/**"
      order:
      - "README.md"
      - "CHANGELOG.md"
      - "pubspec.yaml"
      sortBy: "depthFirst"

    - name: "Test"
      patterns:
      - "test/**"
      sortBy: "depthFirst"

    - name: "Other Project Files"
      patterns:
      - "*.yaml"
      - "*.json"
      - "*.toml"
      - "*.sh"
      - "*.bat"
      sortBy: "alphabetical"

    - name: "Other (Catch-all)"
      patterns:
      - "**/*"
      sortBy: "alphabetical"

# Example of a custom group:
#    - name: "Important Configs First"
#      patterns: ["**/my_critical_config.json", "**/another_settings.yaml"]
#      order: ["my_critical_config.json"]
#      sortBy: "alphabetical"

